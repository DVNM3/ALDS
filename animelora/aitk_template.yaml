# Default AI Toolkit job for Anima (from the user's "Anima AI toolkit setteings.yaml").
# animelora fills: name, training_folder, trigger_word, datasets[0].folder_path / resolution, the step schedule
# (train.steps, batch_size, gradient_accumulation, warmup, save.save_every, max_step_saves_to_keep,
# sample.sample_every) and sample.samples. Everything else is used as written here.
---
job: "extension"
config:
  name: ""
  process:
    - type: "diffusion_trainer"
      training_folder: ""
      sqlite_db_path: "./aitk_db.db"
      device: "cuda"
      trigger_word: ""
      performance_log_every: 10
      network:
        type: "lora"
        linear: 32
        linear_alpha: 32
        conv: 16
        conv_alpha: 16
        lokr_full_rank: true
        lokr_factor: -1
        network_kwargs:
          ignore_if_contains: []
      save:
        dtype: "bf16"
        save_every: 0
        max_step_saves_to_keep: 4
        save_format: "diffusers"
        push_to_hub: false
      datasets:
        - folder_path: ""
          mask_path: null
          mask_min_value: 0.1
          default_caption: ""
          caption_ext: "txt"
          caption_dropout_rate: 0.05
          cache_latents_to_disk: true
          is_reg: false
          network_weight: 1
          resolution:
            - 512
            - 1024
          controls: []
          shrink_video_to_frames: true
          num_frames: 1
          flip_x: false
          flip_y: false
          num_repeats: 1
      train:
        batch_size: 1
        bypass_guidance_embedding: false
        steps: 0
        gradient_accumulation: 4
        train_unet: true
        train_text_encoder: false
        gradient_checkpointing: true
        noise_scheduler: "flowmatch"
        optimizer: "adamw"
        timestep_type: "weighted"
        content_or_style: "balanced"
        optimizer_params:
          weight_decay: 0.01
          betas:
            - 0.9
            - 0.99
        lr_scheduler: "constant_with_warmup"
        lr_scheduler_params:
          num_warmup_steps: 100
        unload_text_encoder: false
        cache_text_embeddings: false
        lr: 0.00002
        ema_config:
          use_ema: true
          ema_decay: 0.99
        skip_first_sample: false
        force_first_sample: false
        disable_sampling: false
        dtype: "bf16"
        diff_output_preservation: false
        diff_output_preservation_multiplier: 1
        diff_output_preservation_class: "1girl"
        switch_boundary_every: 1
        loss_type: "mse"
      logging:
        log_every: 1
        use_ui_logger: true
      model:
        name_or_path: "circlestone-labs/Anima-Base-v1.0-Diffusers"
        quantize: false
        qtype: ""
        quantize_te: false
        qtype_te: ""
        arch: "anima"
        low_vram: false
        model_kwargs: {}
        compile: false
        layer_offloading: false
        layer_offloading_text_encoder_percent: 1
        layer_offloading_transformer_percent: 1
      sample:
        sampler: "flowmatch"
        sample_every: 0
        sample_start_step: 0
        width: 1024
        height: 1024
        samples: []
        neg: "worst quality, low quality, score_1, score_2, score_3, blurry, jpeg artifacts, sepia, signature, artist name"
        seed: 42
        walk_seed: true
        guidance_scale: 4
        sample_steps: 30
        num_frames: 1
        fps: 1
meta:
  name: "[name]"
  version: "1.0"
